services:
  migrate:
    image: ghcr.io/gambojo/tg_vpn:latest
    container_name: tg_vpn_migrate
    command: alembic upgrade head
    env_file:
      - .env
    networks:
      - vpn_bot_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  tg_vpn:
    image: ghcr.io/gambojo/tg_vpn:latest
    container_name: tg_vpn
    env_file:
      - .env
    networks:
      - vpn_bot_network
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: tg_vpn_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vpn_bot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  vpn_bot_network:
    driver: bridge
